openapi: 3.1.0

info:
  title: Smart Campus Notification Service API
  version: 1.0.0
  description: |
    OpenAPI contract for Notification Service (A7).
    Service dùng để gửi notification và cảnh báo trong Smart Campus.
  contact:
    name: FIT4110 Teaching Team
    email: fit4110@example.edu.vn

servers:
  - url: http://localhost:4010
    description: Prism mock server

  - url: https://api.campus.local
    description: Class network placeholder

tags:
  - name: health
    description: Health check endpoints

  - name: notifications
    description: Notification management endpoints

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái service
      description: Endpoint kiểm tra service còn hoạt động.
      tags:
        - health

      security: []

      responses:
        '200':
          description: Service đang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

              examples:
                ok:
                  value:
                    status: ok
                    service: notification-service
                    time: '2026-05-10T08:00:00Z'

  /notifications:
    post:
      operationId: createNotification
      summary: Tạo notification mới
      description: Endpoint nhận request tạo notification từ Core Business.
      tags:
        - notifications

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'

            examples:
              unauthorizedAccess:
                value:
                  sourceService: core-business
                  alertType: UNAUTHORIZED_ACCESS
                  severity: HIGH
                  message: Phát hiện truy cập trái phép tại cổng chính
                  relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc

      responses:
        '201':
          description: Notification đã được tạo

          headers:
            Location:
              description: URI của notification vừa tạo.
              schema:
                type: string
                format: uri

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'

              examples:
                created:
                  value:
                    id: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                    sourceService: core-business
                    alertType: UNAUTHORIZED_ACCESS
                    severity: HIGH
                    message: Phát hiện truy cập trái phép tại cổng chính
                    relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                    status: OPEN
                    createdAt: '2026-05-10T08:00:00Z'
                    resolvedAt: null

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '422':
          $ref: '#/components/responses/UnprocessableEntity'

        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      operationId: listNotifications
      summary: Lấy danh sách notification
      description: Lấy danh sách notification với cursor pagination.
      tags:
        - notifications

      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'

      responses:
        '200':
          description: Danh sách notification

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'

              examples:
                firstPage:
                  value:
                    items:
                      - id: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                        sourceService: core-business
                        alertType: UNAUTHORIZED_ACCESS
                        severity: HIGH
                        message: Phát hiện truy cập trái phép tại cổng chính
                        relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                        status: OPEN
                        createdAt: '2026-05-10T08:00:00Z'
                        resolvedAt: null

                    nextCursor: null
                    hasMore: false

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/recent:
    get:
      operationId: getRecentNotifications
      summary: Lấy notification gần đây
      description: Lấy các notification gần nhất.
      tags:
        - notifications

      parameters:
        - name: limit
          in: query
          required: false
          description: Số notification tối đa cần lấy.

          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Danh sách notification gần đây

          content:
            application/json:
              schema:
                type: object
                additionalProperties: false

                required:
                  - items

                properties:
                  items:
                    type: array
                    minItems: 0
                    maxItems: 100

                    items:
                      $ref: '#/components/schemas/Alert'

              examples:
                recentNotifications:
                  value:
                    items: []

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/{notificationId}:
    get:
      operationId: getNotificationById
      summary: Lấy chi tiết notification
      description: Lấy chi tiết notification theo UUID.
      tags:
        - notifications

      parameters:
        - $ref: '#/components/parameters/NotificationId'

      responses:
        '200':
          description: Chi tiết notification

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: UUID của notification.

      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor dùng để lấy trang tiếp theo.

      schema:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'

    Limit:
      name: limit
      in: query
      required: false
      description: Số item tối đa mỗi trang.

      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false

      required:
        - status
        - service
        - time

      properties:
        status:
          enum:
            - ok
          type: string
          description: Trạng thái service.
          example: ok

        service:
          type: string
          minLength: 2
          maxLength: 80
          description: Tên service.
          example: notification-service

        time:
          type: string
          format: date-time
          description: Thời điểm kiểm tra.
          example: '2026-05-10T08:00:00Z'

    CreateAlertRequest:
      type: object
      additionalProperties: false

      required:
        - sourceService
        - alertType
        - severity
        - message

      properties:
        sourceService:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^[a-z0-9-]+$'
          description: Service tạo notification.
          example: core-business

        alertType:
          enum:
            - UNAUTHORIZED_ACCESS
            - SENSOR_THRESHOLD_EXCEEDED
            - UNKNOWN_PERSON
            - SYSTEM_ERROR
          type: string
          description: Loại cảnh báo.
          example: UNAUTHORIZED_ACCESS

        severity:
          $ref: '#/components/schemas/AlertSeverity'

        message:
          type: string
          minLength: 5
          maxLength: 500
          description: Nội dung notification.
          example: Phát hiện truy cập trái phép tại cổng chính

        relatedEventId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: Event liên quan.
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc

    Alert:
      allOf:
        - $ref: '#/components/schemas/CreateAlertRequest'

        - type: object
          additionalProperties: false

          required:
            - id
            - status
            - createdAt
            - resolvedAt

          properties:
            id:
              type: string
              format: uuid
              description: UUID của notification.

            status:
              enum:
                - OPEN
                - ACKNOWLEDGED
                - RESOLVED
              type: string
              description: Trạng thái notification.
              example: OPEN

            createdAt:
              type: string
              format: date-time
              description: Thời điểm tạo notification.
              example: '2026-05-10T08:00:00Z'

            resolvedAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              description: Thời điểm xử lý xong.
              example: null

    AlertSeverity:
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      type: string
      description: Mức độ nghiêm trọng của notification.
      example: HIGH

    AlertPage:
      type: object
      additionalProperties: false

      required:
        - items
        - nextCursor
        - hasMore

      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100

          items:
            $ref: '#/components/schemas/Alert'

        nextCursor:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor trang tiếp theo.
          example: null

        hasMore:
          type: boolean
          description: Còn dữ liệu hay không.
          example: false

    Problem:
      type: object
      additionalProperties: false

      required:
        - type
        - title
        - status

      properties:
        type:
          type: string
          format: uri
          example: https://campus.local/errors/validation

        title:
          type: string
          minLength: 3
          maxLength: 120
          example: Dữ liệu không hợp lệ

        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400

        detail:
          anyOf:
            - type: string
              maxLength: 500
            - type: 'null'
          example: Payload không đúng JSON Schema

        instance:
          anyOf:
            - type: string
              format: uri
            - type: 'null'
          example: /notifications

        errors:
          type: array
          minItems: 0
          maxItems: 50

          items:
            type: object
            additionalProperties: false

            required:
              - field
              - code
              - message

            properties:
              field:
                type: string
                example: alertType

              code:
                type: string
                example: ENUM_MISMATCH

              message:
                type: string
                example: alertType không nằm trong danh sách cho phép

  responses:
    BadRequest:
      description: Dữ liệu sai định dạng

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: Thiếu hoặc sai xác thực

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: Không đủ quyền

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Resource không tồn tại

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: Xung đột nghiệp vụ

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableEntity:
      description: Vi phạm rule nghiệp vụ

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalServerError:
      description: Lỗi server nội bộ

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
